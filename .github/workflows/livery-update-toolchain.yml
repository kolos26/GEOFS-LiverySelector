name: Livery update toolchain

on:
  push:
    paths:
      - liveries/**
      - livery.json
  workflow_dispatch:

jobs:
  webp-conversion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            liveries/**/*
            .webp/webp_conversion.sh
          sparse-checkout-cone-mode: false  # disable cone mode for wildcard support
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt update && sudo apt install webp

      - name: Convert images
        run: cd liveries && bash ../.webp/webp_conversion.sh

      - name: Commit the file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add liveries/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Convert images to webp"
          git push

  check-images:
    needs: webp-conversion
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            livery.json
            liveries/**/*
            .filecheck/**
            .webhook/requirements.txt
          sparse-checkout-cone-mode: false  # disable cone mode for wildcard support
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .webhook/requirements.txt

      - name: Check liveries
        env:
          MISSING_LIVERIES_WEBHOOK: ${{ secrets.MISSING_LIVERIES_WEBHOOK }}
        run: python3 .filecheck/check_images.py.py

      - name: Fetch commit hash
        id: get_commit
        uses: pr-mpt/actions-commit-hash@v2

      - name: Write file
        uses: 1arp/create-a-file-action@0.4.5
        with:
          path: '.'
          isAbsolutePath: false
          file: '.filecheck/commit.txt'
          content: |
            ${{ steps.get_commit.outputs.hash }}

      - name: Commit the file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .filecheck/commit.txt
          git commit -m "Update .filecheck/commit.txt"
          git push

  discord-livery-announcement:
    needs: check-images
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            livery.json
            .webhook/*
          sparse-checkout-cone-mode: false  # disable cone mode for wildcard support
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .webhook/requirements.txt

      - name: Send webhook
        env:
          LIVERY_UPDATE_WEBHOOK: ${{ secrets.LIVERY_UPDATE_WEBHOOK }}
        run: python3 .webhook/livery_update.py
      
      - name: Fetch commit hash
        id: get_commit
        uses: pr-mpt/actions-commit-hash@v2

      - name: Write file
        uses: 1arp/create-a-file-action@0.4.5
        with:
          path: '.'
          isAbsolutePath: false
          file: '.webhook/commit.txt'
          content: |
            ${{ steps.get_commit.outputs.hash }}

      - name: Commit the file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .webhook/commit.txt
          git commit -m "Update .webhook/commit.txt"
          git push